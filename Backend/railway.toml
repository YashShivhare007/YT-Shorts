[build]
builder = "nixpacks"

[deploy]
# Using a single worker to ensure in-memory state is consistent for status checks.
# Increased timeout to 600s to handle long-running video tasks.
# Pointing to "Backend.backed_api:app" to be explicit about the application path.
startCommand = ". .venv/bin/activate && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 600 'Backend.backed_api:app'"
healthcheckPath = "/health"
healthcheckTimeout = 600
restartPolicyType = "always"

[env]
PYTHON_VERSION = "3.11"
FLASK_ENV = "production"
FLASK_APP = "backed_api.py" 