[build]
builder = "nixpacks"

[deploy]
startCommand = ". /opt/venv/bin/activate && gunicorn --bind 0.0.0.0:$PORT backed_api:app --workers 2 --timeout 300 --keep-alive 2"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "always"

[env]
PYTHON_VERSION = "3.11"
FLASK_ENV = "production"
FLASK_APP = "backed_api.py" 