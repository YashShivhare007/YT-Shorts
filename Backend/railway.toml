[build]
builder = "nixpacks"

[deploy]
# Corrected start command:
# - Using the correct venv path: /opt/venv
# - Using the correct application path: backed_api:app
# - Using a single worker to ensure in-memory state is consistent.
# - Increased timeout to 600s to handle long-running video tasks.
startCommand = ". /opt/venv/bin/activate && gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 600 backed_api:app"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "always"

[env]
PYTHON_VERSION = "3.11"
FLASK_ENV = "production"
FLASK_APP = "backed_api.py" 