[phases.setup]
nixPkgs = ["python311", "python311Packages.pip", "ffmpeg", "yt-dlp", "gcc", "pkg-config"]

[phases.install]
cmds = [
  "python3.11 -m pip install --upgrade pip",
  "python3.11 -m pip install -r requirements.txt"
]

[phases.build]
cmds = ["mkdir -p temp_videos"]

[start]
cmd = "python3.11 -m gunicorn --bind 0.0.0.0:$PORT backed_api:app --workers 2 --timeout 300" 