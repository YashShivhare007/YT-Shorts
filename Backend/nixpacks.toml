[phases.setup]
nixPkgs = ["python311", "ffmpeg", "yt-dlp", "gcc", "pkg-config"]

[phases.install]
cmds = ["pip install --upgrade pip", "pip install -r requirements.txt"]

[phases.build]
cmds = ["mkdir -p temp_videos"]

[start]
cmd = "gunicorn --bind 0.0.0.0:$PORT backed_api:app --workers 2 --timeout 300" 